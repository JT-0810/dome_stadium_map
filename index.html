<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的世界職棒巨蛋地圖</title>

    <!-- Leaflet & Bootstrap CSS / JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap-glyphicons.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
        
        /* 防鋸齒與拼接縫隙 CSS 修正 */
        .leaflet-tile-container img.leaflet-tile {
            transform: scale(1.005) translateZ(0);
            outline: 1px solid transparent;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* 左下角微型統計看板 */
        .stats-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 9999;
            background-color: rgba(255, 255, 255, 0.92);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- 統計看板 -->
    <div class="stats-panel">
        <div style="font-size: 14px; font-weight: bold; color: #333;">
            🌎 我的世界職棒巨蛋地圖
        </div>
        <hr style="margin: 5px 0; border-color: #eee;">
        <div style="font-size: 12px; color: #555; line-height: 1.5;">🏟️ 球場總數：<span id="stat-total" style="font-weight: bold;">16</span> 座</div>
        <div style="font-size: 12px; color: #28a745; line-height: 1.5;">🟢 已去過：<span id="stat-visited" style="font-weight: bold;">0</span> 座</div>
        <div style="font-size: 12px; color: #007bff; line-height: 1.5;">🔵 尚未去過：<span id="stat-unvisited" style="font-weight: bold;">16</span> 座</div>
    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>

<script>
    // 16 座職棒巨蛋完整資料集 (包含 Belluna Dome)
    const stadiumsData = [
        {"id": "taipei_dome", "name": "台北大巨蛋 (Taipei Dome)", "city": "台北", "country": "台灣", "team": "中華職棒", "lat": 25.042439, "lng": 121.559504},
        {"id": "tokyo_dome", "name": "東京巨蛋 (Tokyo Dome)", "city": "東京", "country": "日本", "team": "讀賣巨人", "lat": 35.7056, "lng": 139.7519},
        {"id": "belluna_dome", "name": "西武巨蛋 (Belluna Dome)", "city": "埼玉", "country": "日本", "team": "埼玉西武獅", "lat": 35.7686, "lng": 139.4206},
        {"id": "fukuoka_dome", "name": "福岡巨蛋 / MIZUHO PayPay Dome", "city": "福岡", "country": "日本", "team": "福岡軟銀鷹", "lat": 33.5953, "lng": 130.3622},
        {"id": "kyocera_dome", "name": "京瓷巨蛋大阪 (Kyocera Dome Osaka)", "city": "大阪", "country": "日本", "team": "歐力士猛牛", "lat": 34.6693, "lng": 135.4761},
        {"id": "vantelin_dome", "name": "名古屋巨蛋 / Vantelin Dome Nagoya", "city": "名古屋", "country": "日本", "team": "中日龍", "lat": 35.1858, "lng": 136.9475},
        {"id": "es_con_field", "name": "ES CON FIELD HOKKAIDO", "city": "北廣島", "country": "日本", "team": "北海道日本火腿鬥士", "lat": 42.9908, "lng": 141.554},
        {"id": "gocheok_sky_dome", "name": "高尺天空巨蛋 (Gocheok Sky Dome)", "city": "首爾", "country": "韓國", "team": "培證英雄", "lat": 37.4982, "lng": 126.8671},
        {"id": "tropicana_field", "name": "Tropicana Field", "city": "St. Petersburg", "country": "美國", "team": "坦帕灣光芒", "lat": 27.7682, "lng": -82.6534},
        {"id": "globe_life_field", "name": "Globe Life Field", "city": "Arlington", "country": "美國", "team": "德州遊騎兵", "lat": 32.7473, "lng": -97.082},
        {"id": "minute_maid_park", "name": "Minute Maid Park", "city": "Houston", "country": "美國", "team": "休士頓太空人", "lat": 29.7573, "lng": -95.3555},
        {"id": "t_mobile_park", "name": "T-Mobile Park", "city": "Seattle", "country": "美國", "team": "西雅圖水手", "lat": 47.5914, "lng": -122.3324},
        {"id": "american_family_field", "name": "American Family Field", "city": "Milwaukee", "country": "美國", "team": "密爾瓦基釀酒人", "lat": 43.0282, "lng": -87.9712},
        {"id": "chase_field", "name": "Chase Field", "city": "Phoenix", "country": "美國", "team": "亞利桑那響尾蛇", "lat": 33.4453, "lng": -112.0669},
        {"id": "loandepot_park", "name": "LoanDepot Park", "city": "Miami", "country": "美國", "team": "邁阿密馬林魚", "lat": 25.7781, "lng": -80.2197},
        {"id": "rogers_centre", "name": "Rogers Centre", "city": "Toronto", "country": "加拿大", "team": "多倫多藍鳥", "lat": 43.6414, "lng": -79.3894}
    ];

    // 限制地圖邊界
    const southWest = L.latLng(-89.9, -180);
    const northEast = L.latLng(89.9, 180);
    const bounds = L.latLngBounds(southWest, northEast);

    // 初始化地圖
    const map = L.map('map', {
        center: [20.0, 10.0],
        zoom: 2.5,
        minZoom: 2,
        maxBounds: bounds,
        maxBoundsViscosity: 1.0,
        worldCopyJump: false,
        zoomAnimation: true
    });

    // CARTO Positron 底圖
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        minZoom: 2,
        noWrap: true,
        bounds: bounds,
        subdomains: 'abcd',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    // 狀態持久化 (localStorage)
    let visitedState = JSON.parse(localStorage.getItem('visited_stadiums')) || {};
    const markersMap = {};

    // 標籤圖示定義
    const greenIcon = L.AwesomeMarkers.icon({ icon: 'home', markerColor: 'green', prefix: 'glyphicon' });
    const blueIcon = L.AwesomeMarkers.icon({ icon: 'home', markerColor: 'blue', prefix: 'glyphicon' });

    // 建立所有球場地標
    stadiumsData.forEach(stadium => {
        const isVisited = !!visitedState[stadium.id];
        const marker = L.marker([stadium.lat, stadium.lng], {
            icon: isVisited ? greenIcon : blueIcon
        }).addTo(map);

        const popupContent = `
            <div style="font-family: Arial; width: 220px;">
                <h4 style="margin-top: 0; font-size: 16px; font-weight: bold;">${stadium.name}</h4>
                <b>國家：</b>${stadium.country}<br>
                <b>城市：</b>${stadium.city}<br>
                <b>球隊：</b>${stadium.team}<br><br>
                <button id="btn-${stadium.id}"
                        onclick="toggleVisited('${stadium.id}')"
                        style="padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; background-color: ${isVisited ? '#28a745' : '#007bff'}; color: #fff; transition: background-color 0.2s;">
                    ${isVisited ? '✓ 已去過 (點擊改為未去過)' : '○ 尚未去過 (點擊標記為去過)'}
                </button>
            </div>
        `;

        marker.bindPopup(popupContent);
        marker.bindTooltip(`<div>${stadium.name}</div>`, { sticky: true });
        markersMap[stadium.id] = marker;
    });

    updateStats();

    // 切換已去過 / 未去過狀態
    function toggleVisited(stadiumId) {
        visitedState[stadiumId] = !visitedState[stadiumId];
        localStorage.setItem('visited_stadiums', JSON.stringify(visitedState));

        const isVisited = visitedState[stadiumId];
        const marker = markersMap[stadiumId];

        if (marker) {
            marker.setIcon(isVisited ? greenIcon : blueIcon);
        }

        updateButtonUI(stadiumId);
        updateStats();
    }

    // 更新按鈕樣式
    function updateButtonUI(stadiumId) {
        const btn = document.getElementById('btn-' + stadiumId);
        if (!btn) return;

        const isVisited = !!visitedState[stadiumId];
        btn.innerText = isVisited ? '✓ 已去過 (點擊改為未去過)' : '○ 尚未去過 (點擊標記為去過)';
        btn.style.backgroundColor = isVisited ? '#28a745' : '#007bff';
    }

    // 更新數據看板
    function updateStats() {
        let visitedCount = 0;
        stadiumsData.forEach(stadium => {
            if (visitedState[stadium.id]) visitedCount++;
        });

        const total = stadiumsData.length;
        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-visited').innerText = visitedCount;
        document.getElementById('stat-unvisited').innerText = total - visitedCount;
    }
</script>

</body>
</html>
