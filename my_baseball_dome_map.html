    let visitedState = JSON.parse(localStorage.getItem('visited_stadiums')) || {};

    // 定義 Leaflet 的綠色與藍色圖示
    const greenIcon = L.AwesomeMarkers.icon({
        icon: 'home',
        markerColor: 'green',
        prefix: 'glyphicon'
    });

    const blueIcon = L.AwesomeMarkers.icon({
        icon: 'home',
        markerColor: 'blue',
        prefix: 'glyphicon'
    });

    // 頁面加載完成後自動綁定 15 個地圖針與統計資料
    window.addEventListener('load', function() {
        setTimeout(function() {
            refreshAllMarkers();
            updateStats();
        }, 300);

        // 點擊彈窗時同步更新按鈕文字顏色
        document.addEventListener('click', function (e) {
            stadiumsData.forEach(stadium => {
                if (document.getElementById('btn-' + stadium.id)) {
                    updateButtonUI(stadium.id);
                }
            });
        });
    });

    function toggleVisited(stadiumId) {
        // 切換點擊狀態
        visitedState[stadiumId] = !visitedState[stadiumId];
        
        // 儲存至瀏覽器 LocalStorage
        localStorage.setItem('visited_stadiums', JSON.stringify(visitedState));
        
        // 立即改變對應地圖針顏色與介面
        updateMarkerColor(stadiumId);
        updateButtonUI(stadiumId);
        updateStats();
    }

    function updateMarkerColor(stadiumId) {
        const varName = markerVarMap[stadiumId];
        if (varName && window[varName]) {
            const marker = window[varName];
            const isVisited = !!visitedState[stadiumId];
            
            if (isVisited) {
                marker.setIcon(greenIcon);
            } else {
                marker.setIcon(blueIcon);
            }
        }
    }

    function refreshAllMarkers() {
        stadiumsData.forEach(stadium => {
            updateMarkerColor(stadium.id);
        });
    }

    function updateButtonUI(stadiumId) {
        const btn = document.getElementById('btn-' + stadiumId);
        if (!btn) return;

        const isVisited = !!visitedState[stadiumId];
        if (isVisited) {
            btn.innerText = '✓ 已去過 (點擊改為未去過)';
            btn.style.backgroundColor = '#28a745';
            btn.style.color = '#ffffff';
        } else {
            btn.innerText = '○ 尚未去過 (點擊標記為去過)';
            btn.style.backgroundColor = '#007bff';
            btn.style.color = '#ffffff';
        }
    }

    function updateStats() {
        let visitedCount = 0;
        stadiumsData.forEach(stadium => {
            if (visitedState[stadium.id]) visitedCount++;
        });

        const total = stadiumsData.length;
        document.getElementById('stat-visited').innerText = visitedCount;
        document.getElementById('stat-unvisited').innerText = total - visitedCount;
    }
